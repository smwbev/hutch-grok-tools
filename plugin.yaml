name: hutch-grok-tools
kind: standalone
version: 1.1.0
description: "Routes Hermes' Grok-backed tools through the Hutch relay: the built-in x_search (tool override, tools.override-gated) and a `hutch` web_search provider — same tool names, parameters and result shapes; only transport and credential change."
author: Evgenii (smwbev)
homepage: https://github.com/smwbev/hutch-grok-tools
requires_hermes: ">=0.21.3"
requires_env:
  - HUTCH_API_KEY
  - HUTCH_BASE_URL
capabilities:
  - tools.override
provides_web_providers:
  - hutch
